<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Multiplayer Chat</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app" class="app-container">

    <!-- Screen 1: Lobby -->
    <main id="lobby-screen" class="screen lobby-view">
      <div class="lobby-card">
        <div class="lobby-header">
          <div class="brand-badge">
            <span class="live-dot"></span>
            Real-Time Engine
          </div>
          <h1>Multiplayer Chat</h1>
          <p class="subtitle">Join a room by name to converse in real-time with isolated live channels.</p>
        </div>

        <form id="join-form" class="lobby-form" autocomplete="off">
          <div class="form-group">
            <label for="username-input">Display Name</label>
            <div class="input-wrapper">
              <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <input type="text" id="username-input" placeholder="e.g. Alice" maxlength="24" required autofocus>
            </div>
          </div>

          <div class="form-group">
            <label for="room-input">Room Name</label>
            <div class="input-wrapper">
              <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              </svg>
              <input type="text" id="room-input" placeholder="e.g. general" maxlength="30" required>
            </div>
          </div>

          <!-- Quick Select Room Tags -->
          <div class="tags-container">
            <span class="tags-label">Popular rooms:</span>
            <div class="room-tags">
              <button type="button" class="room-tag" data-room="general">#general</button>
              <button type="button" class="room-tag" data-room="developers">#developers</button>
              <button type="button" class="room-tag" data-room="random">#random</button>
            </div>
          </div>

          <button type="submit" id="join-btn" class="btn-primary">
            <span>Enter Room</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </form>
      </div>
    </main>

    <!-- Screen 2: Chat -->
    <main id="chat-screen" class="screen chat-view hidden">
      <!-- Chat Header -->
      <header class="chat-header">
        <div class="header-left">
          <div class="room-avatar">#</div>
          <div class="room-details">
            <h2 id="active-room-title">#general</h2>
            <div class="online-indicator">
              <span class="pulse-indicator"></span>
              <span id="active-users-count">1 user online</span>
            </div>
          </div>
        </div>

        <div class="header-right">
          <!-- Audio Chime Toggle Button -->
          <button id="mute-btn" class="btn-icon" title="Notification sounds enabled" aria-label="Toggle notifications audio">
            <span id="mute-icon">🔔</span>
          </button>

          <div class="user-pill">
            <span class="user-avatar-circle" id="user-avatar-letter">U</span>
            <span id="current-user-display" class="user-name-text">You</span>
          </div>
          <button id="leave-btn" class="btn-secondary" title="Leave room and return to lobby">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Leave</span>
          </button>
        </div>
      </header>

      <!-- Messages Stream -->
      <section id="messages-container" class="messages-stream" aria-live="polite">
        <!-- Messages will be dynamically rendered here -->
      </section>

      <!-- Live Typing Indicator Banner -->
      <div id="typing-indicator" class="typing-indicator hidden" aria-live="polite">
        <div class="typing-pill">
          <span class="typing-dots">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </span>
          <span id="typing-text" class="typing-text">Someone is typing...</span>
        </div>
      </div>

      <!-- Footer Message Input -->
      <footer class="chat-footer">
        <form id="message-form" class="message-input-form" autocomplete="off">
          <input 
            type="text" 
            id="message-input" 
            placeholder="Type your message..." 
            maxlength="1000" 
            required 
            aria-label="Message"
          >
          <button type="submit" id="send-btn" class="btn-send" aria-label="Send message">
            <span>Send</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
      </footer>
    </main>

  </div>

  <!-- Socket.io client script served automatically by Express -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
